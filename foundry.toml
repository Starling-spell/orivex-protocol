[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
